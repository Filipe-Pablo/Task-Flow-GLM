<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow — Recuperação de senha por e-mail">
  <title>TaskFlow — Recuperar Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
  <script type="module">
    import { authGuard } from "./js/auth-guard.js";
    await authGuard.requireGuest({ redirectTo: "dashboard.html" });
  </script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <span class="auth-logo__mark" aria-hidden="true">TF</span>
          <span class="auth-logo__text">TaskFlow <span class="logo-pro">Pro</span></span>
        </a>
        <h1 class="auth-title">Recuperar senha</h1>
        <p class="auth-subtitle">Informe seu e-mail para receber as instruções de redefinição</p>
      </div>

      <div id="authAlertArea" aria-live="polite"></div>

      <form class="auth-form" id="resetForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="resetEmail">E-mail cadastrado <span class="req">*</span></label>
          <div class="form-input-wrap">
            <input
              type="email"
              id="resetEmail"
              class="form-input"
              placeholder="seu.email@exemplo.com"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="btnResetSubmit">
          <span class="btn-text">Enviar instruções</span>
        </button>
      </form>

      <div id="cooldownNotice" class="cooldown-info" hidden></div>

      <div class="auth-footer">
        Lembrou da sua senha? <a href="index.html" class="auth-link">Voltar ao login</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
