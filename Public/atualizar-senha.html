<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow — Alteração e atualização de senha de acesso">
  <title>TaskFlow — Atualizar Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
  <script type="module">
    import { authGuard } from "./JS/auth-guard.js";
    await authGuard.requireAuth({ requireVerified: true, redirectTo: "index.html" });
  </script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="dashboard.html" class="auth-logo">
          <span class="auth-logo__mark" aria-hidden="true">TF</span>
          <span class="auth-logo__text">TaskFlow <span class="logo-pro">Pro</span></span>
        </a>
        <h1 class="auth-title">Atualizar senha</h1>
        <p class="auth-subtitle">Defina uma nova senha para sua conta</p>
      </div>

      <div id="authAlertArea" aria-live="polite"></div>

      <form class="auth-form" id="updatePasswordForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="currentPassword">Senha atual <span class="req">*</span></label>
          <div class="form-input-wrap">
            <input
              type="password"
              id="currentPassword"
              class="form-input has-toggle"
              placeholder="Digite sua senha atual"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="btn-toggle-pw"
              data-toggle-target="currentPassword"
              aria-label="Exibir senha"
              title="Exibir ou ocultar senha"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">Nova senha <span class="req">*</span></label>
          <div class="form-input-wrap">
            <input
              type="password"
              id="newPassword"
              class="form-input has-toggle"
              placeholder="Digite a nova senha forte"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="btn-toggle-pw"
              data-toggle-target="newPassword"
              aria-label="Exibir senha"
              title="Exibir ou ocultar senha"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmNewPassword">Confirmar nova senha <span class="req">*</span></label>
          <div class="form-input-wrap">
            <input
              type="password"
              id="confirmNewPassword"
              class="form-input has-toggle"
              placeholder="Repita a nova senha"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="btn-toggle-pw"
              data-toggle-target="confirmNewPassword"
              aria-label="Exibir senha"
              title="Exibir ou ocultar senha"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Indicadores interativos dos requisitos da nova senha -->
        <div class="password-requirements" id="passwordRequirements" aria-label="Requisitos da nova senha">
          <span class="requirements-title">Requisitos da nova senha</span>
          <div class="req-item" id="reqMinLength">
            <span class="req-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span>Pelo menos 8 caracteres</span>
          </div>
          <div class="req-item" id="reqLetter">
            <span class="req-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span>Pelo menos uma letra</span>
          </div>
          <div class="req-item" id="reqNumber">
            <span class="req-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span>Pelo menos um número</span>
          </div>
          <div class="req-item" id="reqMatch">
            <span class="req-item__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
            <span>Novas senhas coincidem</span>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="btnUpdatePasswordSubmit">
          <span class="btn-text">Salvar nova senha</span>
        </button>
      </form>

      <div class="auth-footer">
        <a href="dashboard.html" class="auth-link">Voltar ao aplicativo</a>
      </div>
    </div>
  </div>

  <script type="module" src="JS/app.js"></script>
</body>
</html>
