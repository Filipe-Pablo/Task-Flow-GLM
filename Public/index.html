<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow — Entrar no sistema com e-mail e senha">
  <title>TaskFlow — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
  <script type="module">
    import { authGuard } from "./js/auth-guard.js";
    await authGuard.requireGuest({ redirectTo: "dashboard.html" });
  </script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <span class="auth-logo__mark" aria-hidden="true">TF</span>
          <span class="auth-logo__text">TaskFlow <span class="logo-pro">Pro</span></span>
        </a>
        <h1 class="auth-title">Acesse sua conta</h1>
        <p class="auth-subtitle">Informe seu e-mail e senha para continuar</p>
      </div>

      <!-- Área de mensagens dinâmicas de erro e sucesso -->
      <div id="authAlertArea" aria-live="polite"></div>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">E-mail <span class="req">*</span></label>
          <div class="form-input-wrap">
            <input
              type="email"
              id="loginEmail"
              class="form-input"
              placeholder="seu.email@exemplo.com"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="loginPassword">Senha <span class="req">*</span></label>
            <a href="recuperar-senha.html" class="auth-link" style="font-size: 12px;">Esqueceu a senha?</a>
          </div>
          <div class="form-input-wrap">
            <input
              type="password"
              id="loginPassword"
              class="form-input has-toggle"
              placeholder="Sua senha de acesso"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="btn-toggle-pw"
              data-toggle-target="loginPassword"
              aria-label="Exibir senha"
              title="Exibir ou ocultar senha"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="btnLoginSubmit">
          <span class="btn-text">Entrar</span>
        </button>
      </form>

      <div class="auth-footer">
        Não possui uma conta? <a href="cadastro.html" class="auth-link">Criar conta</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
